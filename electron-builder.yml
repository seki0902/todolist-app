appId: com.focusflow.desktop
productName: FocusFlow Desktop
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
asar: true
asarUnpack:
  - node_modules/sql.js/dist/*.wasm
npmRebuild: false
win:
  icon: build-resources/icon.ico
  signAndEditExecutable: false
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  shortcutName: FocusFlow Desktop
mac:
  target: default
linux:
  target: AppImage